<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Farm Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <div id="hud">
      <div id="day-counter">Día 1</div>
      <div id="inventory">
        🌱 Semillas: <span id="seed-count">5</span>
        &nbsp;|&nbsp;
        🥕 Zanahorias: <span id="crop-count">0</span>
        &nbsp;|&nbsp;
        🪙 Monedas: <span id="coin-count">10</span>
      </div>
    </div>

    <canvas id="game-canvas" width="480" height="320"></canvas>

    <div id="shop">
      <span>Tienda:</span>
      <button id="buy-seed-btn">Comprar semilla (3 🪙)</button>
    </div>

    <div id="instructions">
      Muévete: <b>Flechas / WASD</b> &nbsp;|&nbsp;
      Interactuar (labrar / plantar / regar / cosechar): <b>Espacio</b> &nbsp;|&nbsp;
      Pasar día: <b>N</b>
    </div>

    <button id="reset-btn">Reiniciar partida</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
