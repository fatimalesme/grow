<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mini Farm Game</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="game-container">
    <div id="streak-toast"></div>

    <div id="hud">
      <div id="day-counter"><span id="time-icon">☀️</span> Día <span id="day-number">1</span></div>
      <div id="inventory">
        🥕 Cosechado: <span id="crop-count">0</span>
        &nbsp;|&nbsp;
        🪙 Monedas: <span id="coin-count">10</span>
        &nbsp;|&nbsp;
        🔥 Racha: <span id="streak-count">0</span>
      </div>
    </div>

    <div id="level-bar">
      <span id="level-label">⭐ Nivel <span id="level-count">1</span></span>
      <div id="xp-bar-track">
        <div id="xp-bar-fill"></div>
      </div>
      <span id="xp-label">0 / 20 XP</span>
    </div>

    <canvas id="game-canvas" width="480" height="320"></canvas>

    <div id="seed-selector">
      <span>Semilla a plantar (o pulsa 1 / 2):</span>
      <button class="seed-option" data-crop="carrot">🥕 Zanahoria (<span id="carrot-seed-count">5</span>)</button>
      <button class="seed-option" data-crop="pumpkin">🎃 Calabaza (<span id="pumpkin-seed-count">0</span>)</button>
    </div>

    <div id="shop">
      <span>Tienda:</span>
      <button id="buy-carrot-btn">🥕 Semilla zanahoria (3 🪙)</button>
      <button id="buy-pumpkin-btn">🎃 Semilla calabaza (6 🪙)</button>
    </div>

    <div id="quest-panel">
      <span id="quest-title">📜 Misiones</span>
      <ul id="quest-list"></ul>
    </div>

    <div id="instructions">
      Muévete: <b>Flechas / WASD</b> &nbsp;|&nbsp;
      Interactuar (labrar / plantar / regar / cosechar): <b>Espacio</b> &nbsp;|&nbsp;
      Pasar día: <b>N</b>
    </div>

    <button id="reset-btn">Reiniciar partida</button>
  </div>

  <script src="game.js"></script>
</body>
</html>
